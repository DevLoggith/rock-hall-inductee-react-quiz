name: React CI Pipeline

on:
    pull_request:
        branches: [main, master]
        types: [opened, synchronize, reopened]

jobs:
    test:
        name: Run Unit Tests
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v5

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Run tests
              run: npm run test:ci
